spring:
  application:
    name: sb-websocket-three
  datasource:
    url: jdbc:h2:mem:chatdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-local-secret-32-bytes-long}
    expiration-ms: 3600000
